<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Little World</title>
  <style>
    @font-face { font-family: "Founders"; src: url("../fonts/FoundersGrotesk-Bold.otf"); }
    @font-face { font-family: "Karla"; src: url("../fonts/Karla-SemiBold.ttf"); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc0ea; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
      font: 16px "Karla", sans-serif; color: rgba(255,255,255,.85);
      letter-spacing: .04em; pointer-events: none; transition: opacity 1.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">drag the shapes · tap things · open the door</div>
  <script src="world.js"></script>
</body>
</html>
