<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Walk</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
    <nav id="rail" aria-label="Tools">
          <button data-tool="select" title="Select and move" aria-label="Select and move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
      <hr>
          <button data-tool="text" title="Text" aria-label="Text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>
          <button data-tool="image" title="Image" aria-label="Image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg></button>
          <button data-tool="frame" title="Frame for art" aria-label="Frame for art"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><rect x="6.5" y="7.5" width="11" height="9"/></svg></button>
      <hr>
          <button data-tool="shapes" title="Shapes" aria-label="Shapes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><circle cx="17" cy="7.5" r="3.5"/><path d="M7.5 14l4 6h-8z"/><path d="M14 20l6-6"/></svg></button>
          <button data-tool="draw" title="Pencil" aria-label="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg></button>
          <button data-tool="path" title="Path: click point to point, double-click to finish" aria-label="Path: click point to point, double-click to finish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l6-9 5 5 7-9"/><circle cx="3" cy="18" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="21" cy="5" r="1.4"/></svg></button>
          <button data-tool="erase" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/></svg></button>
          <button data-tool="scissors" title="Scissors: cut something out of a photo" aria-label="Scissors: cut something out of a photo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5L20 18"/><path d="M8.5 15.5L20 6"/></svg></button>
      <hr>
          <button data-tool="door" title="Door" aria-label="Door"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3h12v18"/><path d="M4 21h16"/><path d="M14.5 12.5h.5"/></svg></button>
          <button data-tool="thing" title="Thing" aria-label="Thing"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="9" width="14" height="12" rx="1"/><path d="M5 13h14"/><path d="M8 9V5h8v4"/></svg></button>
      <span class="rail-label">colour</span>
      <button id="colourButton" title="Pen colour" aria-label="Pen colour" aria-expanded="false"><span id="colourChip"></span></button>
      <div id="colourPicker" hidden></div>
      <div id="shapePicker" hidden>
        <button data-shape="rect" title="Rectangle" aria-label="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
        <button data-shape="ellipse" title="Circle" aria-label="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
        <button data-shape="triangle" title="Triangle" aria-label="Triangle"><svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></svg></button>
        <button data-shape="line" title="Straight line" aria-label="Straight line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
      </div>
    </nav>
    <header id="bar">
      <span id="roomName"></span>
      <div id="skies">
        <button data-sky="photo">Photo</button>
        <button data-sky="sunset">Sunset</button>
        <button data-sky="day">Day</button>
        <button data-sky="night">Night</button>
      </div>
      <span class="bar-gap"></span>
      <button id="mapButton">Map</button>
      <button id="choose">New walker</button>
      <button id="undo">Undo</button>
      <button id="clear">Clear board</button>
      <button id="help" title="Keys" aria-label="Keys">?</button>
    </header>
    <div id="hint" hidden>Arrow keys walk. Up jumps, or goes through a door. M opens the map. Drop a folder of walk frames anywhere for a new walker.</div>
    <input id="folder" type="file" webkitdirectory multiple accept="image/*" hidden>
    <div id="status" role="status" hidden><span id="statusText"></span><button id="statusClose" aria-label="Close" title="Close">×</button></div>
    <div id="doorChoice" hidden>
      <span id="doorQuestion">Where does this door go?</span>
      <div class="choices">
        <button data-kind="room">New room</button>
        <button data-kind="empty">New empty room</button>
        <button data-kind="outside">New outside</button>
        <button id="pickOnMap">Pick on the map</button>
        <button id="notYet">Not yet</button>
      </div>
    </div>
    <div id="thingChoice" hidden>
      <span>Pick something to put down, then click on a line.</span>
      <div class="choices"></div>
      <div class="choices"><button id="noThing">Never mind</button></div>
    </div>
    <div id="artEditor" hidden>
      <div class="art-panel" role="dialog" aria-label="Make the art for this frame">
        <div class="art-tools">
          <div id="artPens" class="pens"></div>
          <div id="artSizes" class="sizes">
            <button data-size="3" aria-label="Thin pen"><i style="--dot: 4px"></i></button>
            <button data-size="6" aria-label="Medium pen"><i style="--dot: 8px"></i></button>
            <button data-size="16" aria-label="Thick pen"><i style="--dot: 14px"></i></button>
            <button data-size="40" aria-label="Brush"><i style="--dot: 22px"></i></button>
          </div>
          <button id="artEraser">Eraser</button>
          <button id="artPhoto">Add photo</button>
          <input id="artPhotoInput" type="file" accept="image/*" hidden>
          <button id="artClear">Clear</button>
        </div>
        <canvas id="artCanvas"></canvas>
        <div class="art-actions">
          <button id="artDelete">Delete frame</button>
          <span class="spacer"></span>
          <button id="artCancel">Cancel</button>
          <button id="artDone" class="primary">Hang it</button>
        </div>
      </div>
    </div>
    <div id="cutEditor" hidden>
      <div class="art-panel" role="dialog" aria-label="Cut something out of a photo">
        <div class="art-tools">
          <button id="cutPhoto">Choose a photo</button>
          <input id="cutPhotoInput" type="file" accept="image/*" hidden>
          <span id="cutHelp">Choose a photo, then draw a loop around the part you want.</span>
        </div>
        <canvas id="cutCanvas"></canvas>
        <div class="art-actions">
          <label class="cut-name">Name <input id="cutName" type="text" value="" placeholder="Lamp" maxlength="30"></label>
          <span class="spacer"></span>
          <button id="cutCancel">Cancel</button>
          <button id="cutDone" class="primary">Cut it out</button>
        </div>
      </div>
    </div>
    <div id="map" hidden>
      <div id="mapBar">
        <h2>Map</h2>
        <span id="mapHint"></span>
        <div class="choices">
          <button data-new="room">New room</button>
          <button data-new="empty">New empty room</button>
          <button data-new="outside">New outside</button>
          <button id="closeMap">Back to her</button>
        </div>
      </div>
      <div id="mapBoard"><svg id="mapLinks"></svg></div>
    </div>
    <div id="pad">
      <button data-key="left">&#9664;</button>
      <button data-key="up">&#9650;</button>
      <button data-key="right">&#9654;</button>
    </div>
    <script src="frames.js"></script>
    <script src="sky.js"></script>
    <script src="rooms.js"></script>
    <script src="map.js"></script>
    <script src="things.js"></script>
    <script src="art.js"></script>
    <script src="tools.js"></script>
    <script src="make.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
