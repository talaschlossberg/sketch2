<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Walk</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <aside id="panel">
      <button id="panelToggle" aria-expanded="false" aria-controls="panelBody">Tools</button>
      <div class="panel-body" id="panelBody">
        <h3>Tools</h3>
        <div class="tool-list">
          <button data-tool="draw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>Draw</button>
          <button data-tool="erase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9 11l5 5"/></svg>Erase</button>
          <button data-tool="door"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3h12v18"/><path d="M4 21h16"/><path d="M14.5 12.5h.5"/></svg>Door</button>
          <button data-tool="thing"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="9" width="14" height="12" rx="1"/><path d="M5 13h14"/><path d="M8 9V5h8v4"/></svg>Thing</button>
          <button data-tool="frame"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><rect x="6.5" y="7.5" width="11" height="9"/><path d="M7 15l3-3 2 2 2-3 3 4"/></svg>Frame</button>
        </div>
        <h3>Edit</h3>
        <div class="tool-list">
          <button id="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
          <button id="clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Clear lines</button>
        </div>
        <h3>Sky</h3>
        <div id="skies">
          <button data-sky="photo">Photo</button>
          <button data-sky="sunset">Sunset</button>
          <button data-sky="day">Day</button>
          <button data-sky="night">Night</button>
        </div>
        <h3>World</h3>
        <div class="tool-list">
          <button id="mapButton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>Map</button>
          <button id="choose"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v6l-3 7"/><path d="M12 14l3 7"/><path d="M8 11l4-2 4 2"/></svg>New walker</button>
        </div>
        <p id="hint">Arrow keys walk. Up jumps, or goes through a door. M opens the map. Drop a folder of walk frames anywhere for a new walker.</p>
      </div>
    </aside>
    <input id="folder" type="file" webkitdirectory multiple accept="image/*" hidden>
    <div id="status" hidden></div>
    <div id="doorChoice" hidden>
      <span id="doorQuestion">Where does this door go?</span>
      <div class="choices">
        <button data-kind="room">New room</button>
        <button data-kind="empty">New empty room</button>
        <button data-kind="outside">New outside</button>
        <button id="pickOnMap">Pick on the map</button>
        <button id="notYet">Not yet</button>
      </div>
    </div>
    <div id="thingChoice" hidden>
      <span>Pick something to put down, then click on a line.</span>
      <div class="choices"></div>
      <div class="choices"><button id="noThing">Never mind</button></div>
    </div>
    <div id="artEditor" hidden>
      <div class="art-panel" role="dialog" aria-label="Make the art for this frame">
        <div class="art-tools">
          <div id="artPens" class="pens"></div>
          <div id="artSizes" class="sizes">
            <button data-size="3" aria-label="Thin pen"><i style="--dot: 4px"></i></button>
            <button data-size="6" aria-label="Medium pen"><i style="--dot: 8px"></i></button>
            <button data-size="16" aria-label="Thick pen"><i style="--dot: 14px"></i></button>
            <button data-size="40" aria-label="Brush"><i style="--dot: 22px"></i></button>
          </div>
          <button id="artEraser">Eraser</button>
          <button id="artPhoto">Add photo</button>
          <input id="artPhotoInput" type="file" accept="image/*" hidden>
          <button id="artClear">Clear</button>
        </div>
        <canvas id="artCanvas"></canvas>
        <div class="art-actions">
          <button id="artDelete">Delete frame</button>
          <span class="spacer"></span>
          <button id="artCancel">Cancel</button>
          <button id="artDone" class="primary">Hang it</button>
        </div>
      </div>
    </div>
    <div id="map" hidden>
      <div id="mapBar">
        <h2>Map</h2>
        <span id="mapHint"></span>
        <div class="choices">
          <button data-new="room">New room</button>
          <button data-new="empty">New empty room</button>
          <button data-new="outside">New outside</button>
          <button id="closeMap">Back to her</button>
        </div>
      </div>
      <div id="mapBoard"><svg id="mapLinks"></svg></div>
    </div>
    <div id="pad">
      <button data-key="left">&#9664;</button>
      <button data-key="up">&#9650;</button>
      <button data-key="right">&#9654;</button>
    </div>
    <script src="frames.js"></script>
    <script src="sky.js"></script>
    <script src="rooms.js"></script>
    <script src="map.js"></script>
    <script src="things.js"></script>
    <script src="art.js"></script>
    <script src="tools.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
