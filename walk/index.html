<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Walk</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <nav id="rail" aria-label="Tools">
      <button data-tool="select" title="Select: move and resize" aria-label="Select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
      <hr>
      <button data-tool="draw" title="Pencil" aria-label="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg></button>
      <button data-tool="path" title="Path: click point to point" aria-label="Path"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l6-9 5 5 7-9"/><circle cx="3" cy="18" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="21" cy="5" r="1.4"/></svg></button>
      <button data-tool="fill" title="Fill" aria-label="Fill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19.5 15.5c0 1.2.9 2.5 1.5 2.5s1.5-1.3 1.5-2.5S21 13 21 13s-1.5 1.3-1.5 2.5z" class="drop"/></svg></button>
      <button data-tool="erase" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/></svg></button>
      <hr>
      <button data-tool="image" title="Photo" aria-label="Photo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg></button>
      <button data-tool="door" title="Door" aria-label="Door"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3h12v18"/><path d="M4 21h16"/><path d="M14.5 12.5h.5"/></svg></button>
      <div id="fillPicker" hidden></div>
    </nav>
    <header id="bar">
      <span id="roomName"></span>
      <button id="wallButton" class="world-button" aria-haspopup="true"><span class="cap">Wall</span><span id="wallLabel"></span></button>
      <button id="floorButton" class="world-button" aria-haspopup="true"><span class="cap">Floor</span><span id="floorLabel"></span></button>
      <button id="changePhoto" hidden>Change photo</button>
      <span class="bar-gap"></span>
      <button id="mapButton">Map</button>
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
      <button id="help" title="Keys" aria-label="Keys">?</button>
    </header>
    <div id="wallPicker" class="world-picker" hidden></div>
    <div id="floorPicker" class="world-picker" hidden></div>
    <div id="hint" hidden>Arrow keys walk. Up jumps, or goes through a door. M opens the map.</div>
    <input id="imageInput" type="file" accept="image/*" hidden>
    <input id="skyPhotoInput" type="file" accept="image/*" hidden>
    <div id="status" role="status" hidden><span id="statusText"></span><button id="statusClose" aria-label="Close" title="Close">×</button></div>
    <div id="doorChoice" hidden>
      <span id="doorQuestion">Where does this door go?</span>
      <div class="choices">
        <button data-kind="room">New room</button>
        <button data-kind="empty">New empty room</button>
        <button data-kind="outside">New outside</button>
        <button id="pickOnMap">Pick on the map</button>
        <button id="notYet">Not yet</button>
      </div>
    </div>
    <div id="map" hidden>
      <div id="mapBar">
        <h2>Map</h2>
        <span id="mapHint"></span>
        <div class="choices">
          <button data-new="room">New room</button>
          <button data-new="empty">New empty room</button>
          <button data-new="outside">New outside</button>
          <button id="closeMap">Back to her</button>
        </div>
      </div>
      <div id="mapBoard"><svg id="mapLinks"></svg></div>
    </div>
    <div id="pad">
      <button data-key="left" aria-label="Walk left">&#9664;</button>
      <button data-key="up" aria-label="Jump, or go through a door">&#9650;</button>
      <button data-key="right" aria-label="Walk right">&#9654;</button>
    </div>
    <script src="frames.js"></script>
    <script src="sky.js"></script>
    <script src="world.js"></script>
    <script src="rooms.js"></script>
    <script src="map.js"></script>
    <script src="images.js"></script>
    <script src="fill.js"></script>
    <script src="tools.js"></script>
    <script src="make.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
